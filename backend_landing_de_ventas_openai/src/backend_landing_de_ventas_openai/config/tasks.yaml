enviar_email_bienvenida:
  description: >
    Tarea: Enviar un correo electrónico de bienvenida al lead con información del curso.
    - Nombre del Lead: {nombre} {apellido}
    - Email del Lead: {correo_electronico}
    - Programa de Interés: El primer programa de la lista '{programas_interes}'.

    REGLA OBLIGATORIA: DEBES usar la herramienta de email para enviar el correo.
    NO está permitido afirmar que el correo fue enviado sin haber ejecutado la herramienta.
    Solo puedes darlo por enviado si la herramienta devuelve una confirmación de éxito.

    Pasos:
    1. Redacta un mensaje de bienvenida amigable para {nombre}.
    2. Incluye en el cuerpo del correo un breve resumen del programa '{programas_interes}'.
       Para describirlo, CONSULTA tu base de conocimiento (catálogo de programas de Datapath)
       y usa la información oficial de ese programa. No inventes datos que no estén ahí.
    3. Envía el correo usando la herramienta de email. NO intentes adjuntar ningún archivo por ahora.
    4. Devuelve como respuesta final el texto EXACTO que devolvió la herramienta de email.
  expected_output: >
    El texto EXACTO devuelto por la herramienta de email, confirmando que el correo
    fue enviado a {correo_electronico}.
  agent: comunicador_cliente


registrar_lead_en_sheets:
  description: >
    Tarea: Registrar al lead en Google Sheets.

    REGLA OBLIGATORIA: DEBES usar la herramienta de Google Sheets para registrar el lead.
    NO está permitido afirmar que se registró sin haber ejecutado la herramienta.
    Solo puedes darlo por registrado si la herramienta devuelve una confirmación de éxito.

    Pasos:
    1. Llama a la herramienta de Google Sheets con los siguientes datos:
       Nombre: {nombre}, Apellido: {apellido}, Correo: {correo_electronico}, Código de país: {pais}, Número de Celular: {numero_celular}, Programas: {programas_interes}.
    2. Devuelve como respuesta final el texto EXACTO que devolvió la herramienta.
  expected_output: >
    El texto EXACTO devuelto por la herramienta de Google Sheets confirmando el registro.
  agent: coordinador_ventas
  context:
    - enriquecer_perfil_lead


notificar_ventas_telegram:
  description: >
    Tarea: Notificar al asesor de ventas por Telegram.

    REGLA OBLIGATORIA: DEBES usar la herramienta "Enviar Mensaje de Telegram".
    NO está permitido afirmar que el mensaje fue enviado sin haber ejecutado la herramienta.
    Está PROHIBIDO inventar o suponer el resultado. Solo puedes dar por enviada la
    notificación si la herramienta DEVUELVE una confirmación que empiece con
    "Mensaje de Telegram enviado exitosamente".

    Pasos:
    1. Llama a la herramienta "Enviar Mensaje de Telegram" con el parámetro 'mensaje'
       conteniendo exactamente estos datos del lead:
       Nombre: {nombre} {apellido}, Celular: {numero_celular}, Email: {correo_electronico}, Programa(s): {programas_interes}.
       NO pases el parámetro 'chat_id' (la herramienta usa el chat configurado por defecto).
    2. Lee el texto que devolvió la herramienta.
    3. Si empieza con "Mensaje de Telegram enviado exitosamente", devuélvelo tal cual como respuesta final.
       Si devolvió un error, reporta ese error exacto; NO digas que se envió.
  expected_output: >
    El texto EXACTO devuelto por la herramienta de Telegram. Debe empezar con
    "Mensaje de Telegram enviado exitosamente" si todo salió bien.
  agent: coordinador_ventas
  context:
    - enriquecer_perfil_lead


enriquecer_perfil_lead:
  description: >
    Tarea: Enriquecer el perfil del lead para el equipo de ventas.
    - Nombre a buscar: {nombre} {apellido}

    Pasos:
    1. Realiza una búsqueda en la web para encontrar el perfil de LinkedIn o la empresa actual del lead.
    2. Si encuentras una URL relevante, extrae de ella un resumen de 1-2 frases sobre su rol o empresa.
    3. Si no encuentras nada, indícalo.

    El resultado de esta tarea será utilizado por otros agentes.
  expected_output: >
    Un breve párrafo con el contexto profesional del lead, que se pasará a la tarea de notificación por Telegram.
  agent: investigador_enriquecimiento
