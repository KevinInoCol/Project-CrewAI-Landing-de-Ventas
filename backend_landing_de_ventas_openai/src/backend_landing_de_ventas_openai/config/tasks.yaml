enviar_email_bienvenida:
  description: >
    Tarea: Enviar un correo electrónico de bienvenida al lead con información del curso.
    - Nombre del Lead: {nombre} {apellido}
    - Email del Lead: {correo_electronico}
    - Programa de Interés: El primer programa de la lista '{programas_interes}'.
    
    Pasos:
    1. Redacta un mensaje de bienvenida amigable para {nombre}.
    2. Incluye en el cuerpo del correo un breve resumen del programa '{programas_interes}'. 
       Para 'n8n Básico', menciona que es un curso para aprender a crear automatizaciones sin código, 
       conectando aplicaciones como Google Sheets, Slack y Trello. Destaca que no se necesita experiencia previa.
    3. Envía el correo usando la herramienta de email. NO intentes adjuntar ningún archivo por ahora.
  expected_output: >
    Confirmación de que el correo de texto con la información del curso fue enviado exitosamente a {correo_electronico}.
  agent: comunicador_cliente


notificar_ventas_y_registrar:
  description: >
    Tarea: Notificar a ventas y registrar al lead.
    
    Pasos:
    1. Registra los siguientes datos en la hoja de cálculo de Google Sheets:
       Nombre: {nombre}, Apellido: {apellido}, Correo: {correo_electronico}, Código de país: {pais}, Número de Celular: {numero_celular}, Programas: {programas_interes}.
    2. Envía un mensaje de WhatsApp al asesor de ventas al número '{numero_asesor_ventas}'. El mensaje debe incluir:
       Nombre: {nombre} {apellido}, Celular: {numero_celular}, Email: {correo_electronico}, Programa(s): {programas_interes}.
  expected_output: >
    Confirmación de ambas acciones. Ejemplo: "Notificación enviada a WhatsApp y lead registrado en Google Sheets."
  agent: coordinador_ventas
  context:
    - enriquecer_perfil_lead


enriquecer_perfil_lead:
  description: >
    Tarea: Enriquecer el perfil del lead para el equipo de ventas.
    - Nombre a buscar: {nombre} {apellido}
    
    Pasos:
    1. Realiza una búsqueda en la web para encontrar el perfil de LinkedIn o la empresa actual del lead.
    2. Si encuentras una URL relevante, extrae de ella un resumen de 1-2 frases sobre su rol o empresa.
    3. Si no encuentras nada, indícalo.
    
    El resultado de esta tarea será utilizado por otros agentes.
  expected_output: >
    Un breve párrafo con el contexto profesional del lead, que se pasará a la tarea de notificación por WhatsApp.
  agent: investigador_enriquecimiento