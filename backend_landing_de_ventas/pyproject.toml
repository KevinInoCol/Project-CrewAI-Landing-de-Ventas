[project]
name = "backend_landing_de_ventas"
version = "0.1.0"
description = "backend_landing_de_ventas using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.14.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "python-dotenv>=1.0.0",
    "duckduckgo-search>=6.0.0",
    "heyoo>=0.0.8",
    "pygsheets>=2.0.6",
    "ollama>=0.3.0",
]

[project.scripts]
backend_landing_de_ventas = "backend_landing_de_ventas.main:run"
run_crew = "backend_landing_de_ventas.main:run"
train = "backend_landing_de_ventas.main:train"
replay = "backend_landing_de_ventas.main:replay"
test = "backend_landing_de_ventas.main:test"
run_with_trigger = "backend_landing_de_ventas.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
